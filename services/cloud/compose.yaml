services:
  nextcloud:
    image: nextcloud:33-apache
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    environment:
      - POSTGRES_HOST=nextcloud-db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - REDIS_HOST_PASSWORD=${REDIS_HOST_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://cloud.maiahub.com.br
      - NC_default_phone_region=BR
    volumes:
      - /mnt/data/nextcloud/config:/var/www/html/config
      - /mnt/data/nextcloud/apps:/var/www/html/apps
      - /mnt/data/nextcloud/custom_apps:/var/www/html/custom_apps
      - /mnt/data/nextcloud/userdata:/var/www/html/data
    extra_hosts:
      - "cloud.maiahub.com.br:172.18.0.3"
      - "office.maiahub.com.br:172.18.0.3"
    networks:
      - proxy
      - nextcloud_internal

  nextcloud-db:
    image: postgres:18
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /mnt/data/nextcloud/db:/var/lib/postgresql
    networks:
      - nextcloud_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_HOST_PASSWORD}
    volumes:
      - /mnt/data/nextcloud/redis:/data
    networks:
      - nextcloud_internal

  nextcloud-collabora:
    image: collabora/code:latest
    container_name: nextcloud-collabora
    restart: unless-stopped
    environment:
      - server_name=office.maiahub.com.br
      - aliasgroup1=https://cloud.maiahub.com.br:443
      - DONT_GEN_SSL_CERT=YES
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
    networks:
      - proxy
      - nextcloud_internal

  nextcloud-elasticsearch:
    image: elasticsearch:9.4.2
    container_name: nextcloud-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx2g
    volumes:
      - /mnt/data/nextcloud/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - nextcloud_internal

  nextcloud-clamav:
    image: clamav/clamav-debian:latest
    container_name: nextcloud-clamav
    restart: unless-stopped
    networks:
      - nextcloud_internal

  # Sidecar do notify_push — reinicia até o app ser instalado no Nextcloud (comportamento esperado)
  nextcloud-notify-push:
    image: nextcloud:33-apache
    container_name: nextcloud-notify-push
    restart: unless-stopped
    entrypoint: /var/www/html/custom_apps/notify_push/bin/aarch64/notify_push
    command: /var/www/html/config/config.php
    environment:
      - PORT=7867
      - NEXTCLOUD_URL=http://nextcloud
    volumes:
      - /mnt/data/nextcloud/config:/var/www/html/config:ro
      - /mnt/data/nextcloud/custom_apps:/var/www/html/custom_apps:ro
    depends_on:
      - nextcloud
    networks:
      - proxy
      - nextcloud_internal

  nextcloud-imaginary:
    image: nextcloud/aio-imaginary:latest
    container_name: nextcloud-imaginary
    restart: unless-stopped
    networks:
      - nextcloud_internal

networks:
  proxy:
    external: true
  nextcloud_internal:
    internal: true
