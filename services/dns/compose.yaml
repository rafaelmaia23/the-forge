services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./config:/opt/adguardhome/conf
      - ./data:/opt/adguardhome/work
    networks:
      proxy:
        # IP fixo — o Uptime Kuma tem este endereço hardcoded no monitor de DNS
        # e no seu próprio `dns:` (ADR-008). A rede proxy reserva 172.18.0.0/17
        # para IPs fixos, fora do pool dinâmico do Docker, para que este endereço
        # nunca seja ocupado por outro container após um reboot (ADR-011).
        ipv4_address: 172.18.0.2

networks:
  proxy:
    external: true
