services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    dns:
      # AdGuard primeiro (resolve os domínios internos do homelab), com fallback
      # público. O fallback existe para o caminho de NOTIFICAÇÃO: com apenas o
      # AdGuard, uma queda do próprio AdGuard impedia o Uptime Kuma de resolver o
      # endpoint do canal de alerta — ele detectava a falha e não conseguia
      # avisar, justamente quando mais importava. Ver ADR-012.
      - 172.18.0.2
      - 9.9.9.9
    volumes:
      - ./data:/app/data
    networks:
      proxy:
        # IP fixo — os watchdogs rodam no HOST e mandam heartbeat para os push
        # monitors daqui. O host não resolve nomes de container (o DNS do Docker
        # é interno à rede), então a URL de push precisa de um IP estável.
        ipv4_address: 172.18.0.4

  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    hostname: homelab
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./netdata-data/config:/etc/netdata
      - ./netdata-data/lib:/var/lib/netdata
      - ./netdata-data/cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NETDATA_CLAIM_TOKEN=
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - proxy

networks:
  proxy:
    external: true
