services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      proxy:
        # IP fixo — o extra_hosts do nextcloud e do nextcloud-collabora aponta
        # cloud/office.maiahub.com.br para este endereço (hairpin NAT). Sem o
        # ipv4_address, o NPM recebia IP dinâmico e o extra_hosts só funcionava
        # por coincidência: em 2026-07-28 o .3 foi parar em outro container e
        # o Collabora quebrou silenciosamente. Ver ADR-011.
        ipv4_address: 172.18.0.3

networks:
  proxy:
    external: true
